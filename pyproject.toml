[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamauction"
version = "0.1.0"
description = "Kernel causal models for repeated auctions with dynamic values"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "numpy",
  "scikit-learn",
  "matplotlib",
  "scipy",
  "pandas",
  "gymnasium",
  "torch",
  "tqdm",
]

[project.optional-dependencies]
benchmark = [
  "stable-baselines3[extra]>=2.3.0",
  "shimmy>=0.2.0",
  "tensorboard>=2.14.0",
  "hydra-core>=1.3.0",
  "submitit>=1.5.0",
  "tabulate",
  "seaborn",
  "ipykernel",
]
dev = [
  "pytest",
  "black",
  "flake8",
]

[tool.setuptools.packages.find]
where = ["."]