[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamicauc"
version = "0.1.0"
description = "Kernel causal models for repeated auctions with dynamic values"
readme = "README.md"
requires-python = ">=3.9"

authors = [
  { name = "Your Name", email = "your@email.com" }
]

dependencies = [
  "numpy",
  "scikit-learn",
  "matplotlib",
  "hydra-core",
  "pandas"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "flake8"
]

[tool.setuptools.packages.find]
where = ["."]