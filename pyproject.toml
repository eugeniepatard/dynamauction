[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamauction"
version = "0.1.0"
description = "Kernel causal models for repeated auctions with dynamic values"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.2",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "pandas>=2.0",
  "gymnasium>=0.29",
  "torch>=2.0",
  "tqdm>=4.65",
]

[[project.authors]]
name = "Benjamin Heymann"

[[project.authors]]
name = "Eugénie Patard"

[[project.authors]]
name = "Corentin Pla"

[[project.authors]]
name = "Patrick Loiseau"

[project.optional-dependencies]
benchmark = [
  "stable-baselines3>=2.8.0",
  "shimmy>=0.2.0",
  "tensorboard>=2.14.0",
  "hydra-core>=1.3.0",
  "submitit>=1.5.0",
  "tabulate",
  "seaborn",
  "ipykernel",
  "ipywidgets>=8.0",
]
dev = [
  "pytest",
  "black",
  "flake8",
  "stable-baselines3>=2.8.0",
  "hydra-core>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dynamauction*"] # limits what gets installed excludes benchmark/, tests/, docs/

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with -m 'not slow')"]
pythonpath = ["."]
