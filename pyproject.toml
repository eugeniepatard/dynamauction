[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamauction"
version = "0.1.0"
description = "Kernel causal models for repeated auctions with dynamic values"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"

dependencies = [
  "numpy>=2.0",
  "scikit-learn>=1.4.2",
  "matplotlib>=3.8.4",
  "scipy>=1.13",
  "pandas>=2.2.2",
  "gymnasium>=0.29.1",
  "torch>=2.3",
  "tqdm>=4.65",
]

[[project.authors]]
name = "Benjamin Heymann"

[[project.authors]]
name = "Eugénie Patard"

[[project.authors]]
name = "Corentin Pla"

[[project.authors]]
name = "Patrick Loiseau"

[project.optional-dependencies]
benchmark = [
  "stable-baselines3>=2.8.0",
  "shimmy>=0.2.0",
  "tensorboard>=2.14.0",
  "hydra-core>=1.3.0",
  "submitit>=1.5.0",
  "tabulate",
  "seaborn",
  "ipykernel",
  "ipywidgets>=8.0",
]
dev = [
  "pytest",
  "black",
  "flake8",
  "stable-baselines3>=2.8.0",
  "hydra-core>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dynamauction*"] # limits what gets installed excludes benchmark/, tests/, docs/

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
  "paper: checks that the code still reproduces the paper's results in benchmark/benchmark_results/main/ (run with -m paper)",
]
addopts = "-m 'not paper'"   # the paper check is not part of the default run (a -m on the command line replaces this one)
pythonpath = ["."]
