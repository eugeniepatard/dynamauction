# Default parameters for benchmark/evaluate.py
#
# Hydra loads this file automatically when running:
#   python -m benchmark.evaluate
#
# Any field can be overridden on the command line with key=value syntax:
#   python -m benchmark.evaluate horizon_eta=100 n_seeds=1000
#   python -m benchmark.evaluate algos=[ppo,sac] baselines=[fipla]
#   python -m benchmark.evaluate include_shading=true shading_alphas=[0.2,0.6,0.8]
#   python -m benchmark.evaluate save=false          # dry run
#
# Run two eta values in parallel (Hydra multirun):
#   python -m benchmark.evaluate --multirun horizon_eta=50,100
#
# Preview the resolved config without running:
#   python -m benchmark.evaluate --cfg job

# ── Scenario ──────────────────────────────────────────────────────────────────
horizon_eta: 50

# ── Evaluation ────────────────────────────────────────────────────────────────
n_seeds: 30
policy_seed: 0
max_bid: 5.0
save: true
mask_expected_reward: true

# ── Policy selection ──────────────────────────────────────────────────────────
algos: [ppo, sac, td3]          # use [] to skip all RL
baselines: [fipla, constant, random]  # use [] to skip all

# ── Simple baseline parameters ────────────────────────────────────────────────
constant_bid: 0.5
random_max_bid: 1.0

# ── Simulation-based policies ─────────────────────────────────────────────────
n_rollouts: 10
shading_alphas: [0.8]

include_greedy:      false
include_shading:     false
include_mpc:         false
include_mpc_oracle:  false
include_mpc_timebin: false

# ── MPC parameters ────────────────────────────────────────────────────────────
mpc_horizons:         [7.0]
mpc_alpha_candidates: [0.6, 0.8, 1.0, 1.2, 1.5]
mpc_n_bins:           [2]
mpc_model:            null   # null → auto-resolve pretrained weights

# ── Hydra internals ───────────────────────────────────────────────────────────
# Prevent Hydra from changing the working directory or creating output folders.
hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .
  sweep:
    dir: .
    subdir: ${hydra.job.num}
