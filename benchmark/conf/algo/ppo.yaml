name: ppo
# selected on the main scenario (144-configuration search, 200 validation campaigns)
learning_rate: 5e-5
gamma: 0.99
# PPO-specific
n_steps: 256       # steps per environment per update (rollout = n_steps * n_envs)
batch_size: 128    # mini-batch size
n_epochs: 10
gae_lambda: 0.90
ent_coef: 0.0
