# Camera-ready evaluation configuration
# Pass to evaluate.py with: python -m benchmark.evaluate --config camera-ready-exp/eval_config.yaml
#
# The scenario block references a preset from dynamauction/scenarios/presets.py.
# Only fields in 'overrides' need to be specified — everything else comes from the preset.

scenario:
  preset: survival-second-price-exponential  # key in SCENARIO_PRESETS
  overrides:
    horizon_eta: 50  # overrides the preset's eta (default 50 matches the paper)

evaluation:
  n_seeds: 1000
  mask_expected_reward: true  # hide expected_reward from RL policies (paper setting)
  policy_seed: 0             # seed for SimulationEstimator RNG (matches paper run)

# RL models: paths to best_model stems (without .zip).
# obs_rms.pkl is loaded from the same directory automatically.
# NOTE: SAC and TD3 use the lr=... directories (original end-of-training obs_rms).
#       The eta50/ directories have recomputed obs_rms and produce different results.
rl_models:
  ppo: benchmark/models/ppo/eta50/lr=0.0003_ent=0.02_steps=512_gamma=0.95_epochs=5/best_model
  sac: benchmark/models/sac/lr=5e-05_bs=512_warmup=500_gamma=0.95/best_model
  td3: benchmark/models/td3/lr=0.0001_bs=512_noise=0.1_warmup=500_gamma=0.99/best_model

baselines:
  - fipla

sim_policies:
  greedy: false
  shading:
    alphas: [0.7]
    n_rollouts: 10
  mpc:
    model: benchmark/models/mlp_valuation_head/survival-second-price-exponential_h128-128_ep500_e500_lr0.001_s42.pt
    horizons: [10, 25]
    alpha_candidates: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
    n_rollouts: 10
  mpc_timebin:
    model: benchmark/models/mlp_valuation_head/survival-second-price-exponential_h128-128_ep500_e500_lr0.001_s42.pt
    horizons: [10, 25]
    n_bins: [2, 3]
    alpha_candidates: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
    n_rollouts: 10

