name: Notebooks & Benchmark Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  notebooks:
    name: Execute tutorial notebooks (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]   # oldest and newest supported versions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with benchmark and notebook deps
        run: pip install -e ".[benchmark]" nbconvert jupyter ipykernel

      - name: Register kernel
        run: python -m ipykernel install --user --name python3

      # ── Tutorial notebooks ──────────────────────────────────────────────────
      - name: Execute dynamauction_tutorial.ipynb
        shell: bash
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=300 \
            --output dynamauction_tutorial_out.ipynb \
            docs/dynamauction_tutorial.ipynb

      - name: Execute simulator_tutorial.ipynb
        shell: bash
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=600 \
            --output simulator_tutorial_out.ipynb \
            docs/simulator_tutorial.ipynb

      # ── Upload executed notebooks as artifacts for inspection ───────────────
      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebooks-${{ matrix.os }}-py${{ matrix.python-version }}
          path: "*_out.ipynb"
          retention-days: 7

  benchmark-smoke:
    name: Benchmark smoke test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]   # oldest and newest supported versions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with benchmark deps
        run: pip install -e ".[benchmark]"

      # ── Quick import and version check ──────────────────────────────────────
      - name: Check package imports cleanly
        run: python -c "import dynamauction as dac; print(dac.__version__); print(dac.list_scenarios())"

      # ── Evaluate FiPla only: 3 seeds, no RL, no MPC, no save ───────────────
      - name: Run evaluate.py smoke test (η=50, FiPla only)
        shell: bash
        run: |
          python -m benchmark.evaluate \
            --horizon-eta 50 \
            --algos none \
            --baselines fipla \
            --sim-policies none \
            --n-seeds 3 \
            --no-save

      # ── Train MLP valuation head with minimal settings ──────────────────────
      - name: Smoke-test train_mlp.py
        shell: bash
        run: |
          python -m benchmark.train_mlp \
            --n-episodes 5 \
            --n-epochs 3 \
            --hidden-dims 16 16 \
            --seed 0
